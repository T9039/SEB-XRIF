[project]
name = "seb-xrif"
version = "0.1.0"
description = "Scalable, Evidence-Based XR Integration Framework - analytics, service, and evaluation layers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # data layer
    "pandas>=2.2",
    "numpy>=2.0",
    "pandera>=0.20",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    # analytics layer
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "optuna>=4.0",
    "shap>=0.46",
    "lime>=0.2",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # tracking and versioning
    "mlflow>=3.0",
    # service layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "gunicorn>=23.0",
    "structlog>=24.4",
    "httpx>=0.27",
    # evaluation layer
    "pingouin>=0.5.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "dvc>=3.55",
    "jupyterlab>=4.3",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
