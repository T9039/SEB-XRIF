# SEB-XRIF analytics configuration.
# Values are fixed for reproducibility; see specification section 4.5.

seed: 42
test_size: 0.2
cv_folds: 10
# Parallelism: 1 keeps the matrix single-threaded and avoids nested worker
# pools. Raise only if you know the estimators do not nest (see build_pipeline).
n_jobs: 1
target: Class
class_labels: [L, M, H]

categorical:
  - gender
  - NationalITy
  - PlaceofBirth
  - StageID
  - GradeID
  - SectionID
  - Topic
  - Semester
  - Relation
  - ParentAnsweringSurvey
  - ParentschoolSatisfaction
  - StudentAbsenceDays

behavioural:
  - raisedhands
  - VisITedResources
  - AnnouncementsView
  - Discussion

random_forest:
  n_estimators: 100
  class_weight: balanced
  random_state: 42
  n_jobs: -1

paths:
  raw: data/raw/xAPI-Edu-Data.csv
  processed: data/processed/learners.parquet
  model: models/model.joblib
  metadata: models/model.meta.json
  reports: reports
