# SEB-XRIF analytics configuration.
# Values are fixed for reproducibility; see specification section 4.5.

seed: 42
test_size: 0.2
cv_folds: 10
# Parallelism: 1 keeps the matrix single-threaded and avoids nested worker
# pools. Raise only if you know the estimators do not nest (see build_pipeline).
n_jobs: 1
target: Class
class_labels: [L, M, H]

# MLflow tracking. Override the URI with the MLFLOW_TRACKING_URI env var
# (docker-compose points it at the mlflow service). MLflow 3 retired the
# filesystem backend, so the local default is SQLite.
mlflow_tracking_uri: sqlite:///mlflow.db
mlflow_experiment: seb-xrif
mlflow_registered_model: seb-xrif-random-forest

# Application database (override with the DATABASE_URL env var).
database_url: sqlite:///sebxrif.db

# Training data source: 'csv' (the bundled seed) or 'db' (Postgres, with a
# CSV fallback when the database is empty).
data_source: csv

# Learning Record Store (lrsql in docker-compose maps to host :8081).
lrs_endpoint: http://localhost:8081/xapi
lrs_key: seb-xrif-lrs
lrs_secret: seb-xrif-secret

categorical:
  - gender
  - NationalITy
  - PlaceofBirth
  - StageID
  - GradeID
  - SectionID
  - Topic
  - Semester
  - Relation
  - ParentAnsweringSurvey
  - ParentschoolSatisfaction
  - StudentAbsenceDays

behavioural:
  - raisedhands
  - VisITedResources
  - AnnouncementsView
  - Discussion

random_forest:
  n_estimators: 100
  class_weight: balanced
  random_state: 42
  n_jobs: -1

paths:
  raw: data/raw/xAPI-Edu-Data.csv
  processed: data/processed/learners.parquet
  model: models/model.joblib
  metadata: models/model.meta.json
  reports: reports
