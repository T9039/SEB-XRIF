services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sebxrif:sebxrif@db:5432/sebxrif
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Share trained artifacts between the host and the container.
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sebxrif
      POSTGRES_PASSWORD: sebxrif
      POSTGRES_DB: sebxrif
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sebxrif"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts

volumes:
  pgdata:
  mlartifacts:
