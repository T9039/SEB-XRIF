# SEB-XRIF reproducible pipeline.
#
# Run `uv run dvc repro` to regenerate the processed data and the promoted
# model from a clean checkout. See the technical specification, section 9.

stages:
  prepare:
    cmd: uv run python -m analytics.data --out data/processed/learners.parquet
    deps:
      - data/raw/xAPI-Edu-Data.csv
      - analytics/data.py
      - analytics/schema.py
    outs:
      - data/processed/learners.parquet

  train:
    cmd: uv run python -m analytics.train --models random_forest --no-mlflow
    deps:
      - analytics
      - data/raw/xAPI-Edu-Data.csv
    outs:
      - models/model.joblib
      - models/shap.json
    metrics:
      - models/model.meta.json:
          cache: false
